<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101418">
  <meta name="description" content="Factory production tracking: log item movement through stages from the floor, fully offline-capable.">
  <title>Life Style Track</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <noscript>
    <p style="padding:20px;font-family:sans-serif">Life Style Track needs JavaScript — it keeps
    working offline by queueing entries on this device, which a static page cannot do.</p>
  </noscript>
  <header id="topbar" hidden>
    <h1>Life Style Track</h1>
    <button id="sync-pill" type="button" role="status" aria-live="polite"
            title="Sync status — tap for details"><span class="dot" aria-hidden="true"></span><span id="sync-text">…</span></button>
  </header>

  <div id="session-banner" hidden>
    Session expired — logging still works and syncs after you <a href="#/login">sign in</a>.
  </div>

  <main id="view"></main>

  <nav id="tabs" hidden>
    <a href="#/items" data-tab="items">Items</a>
    <a href="#/reports" data-tab="reports">Reports</a>
    <a href="#/office" data-tab="office">Office</a>
  </nav>

  <script src="/static/js/db.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
