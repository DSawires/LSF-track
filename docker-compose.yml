# One command runs everything:
#
#     docker compose up
#
# Boot logs print a generated admin password on first start (or set
# LSF_ADMIN_PASSWORD in a `.env` file next to this compose file).
#
# Public deployment (EC2 etc.):
#   1. Point a DNS record at the instance; open ports 80 and 443 only.
#   2. In `.env`, set:
#        LSF_DOMAIN=track.example.com     # Caddy then gets TLS from Let's Encrypt
#        LSF_SECURE_COOKIES=true
#        LSF_SECRET_KEY=<python -c "import secrets; print(secrets.token_urlsafe(48))">
#        LSF_ADMIN_PASSWORD=<a real one>
#        POSTGRES_PASSWORD=<a real one>
#   3. docker compose up -d
#
# Without LSF_DOMAIN the proxy serves plain HTTP on port 80 — fine for a LAN or
# a first look, not for the public internet.
#
# Set LSF_DEMO=true for a throwaway instance pre-loaded with sample data.

# Bounded log files everywhere: this box runs unattended, and Docker's default
# json-file driver grows until the disk fills.
x-logging: &bounded-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lsf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lsf}
      POSTGRES_DB: lsf_track
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lsf -d lsf_track"]
      interval: 2s
      timeout: 3s
      retries: 30
    logging: *bounded-logs
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    # Only the proxy can reach the app (no published ports), so trusting
    # X-Forwarded-For here is safe and gives the login throttle real client IPs.
    command: ["--proxy-headers", "--forwarded-allow-ips", "*"]
    environment:
      LSF_DATABASE_URL: postgresql+psycopg://lsf:${POSTGRES_PASSWORD:-lsf}@db:5432/lsf_track
      # Empty means the entrypoint generates a key ONCE and persists it on the
      # uploads volume, so sessions survive restarts either way. Set your own
      # to manage it; placeholder values are refused at boot.
      LSF_SECRET_KEY: ${LSF_SECRET_KEY:-}
      # The app refuses to boot with LSF_DOMAIN set while this is false, so a
      # TLS deployment cannot silently ship insecure cookies.
      LSF_SECURE_COOKIES: ${LSF_SECURE_COOKIES:-false}
      LSF_DOMAIN: ${LSF_DOMAIN:-}
      LSF_ADMIN_USERNAME: ${LSF_ADMIN_USERNAME:-admin}
      LSF_ADMIN_PASSWORD: ${LSF_ADMIN_PASSWORD:-}
      LSF_DEMO: ${LSF_DEMO:-false}
      LSF_UPLOAD_DIR: /srv/lsf/data/uploads
      # One S3 bucket for photos (images/) and database dumps (backups/).
      # Unset means local disk on the uploads volume. On EC2, prefer an
      # instance role over keys (and raise the IMDS hop limit to 2 so
      # containers can reach instance credentials).
      LSF_S3_BUCKET: ${LSF_S3_BUCKET:-}
      LSF_S3_PREFIX: ${LSF_S3_PREFIX:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
    volumes:
      - uploads:/srv/lsf/data
    healthcheck:
      # /health does a real SELECT 1; a container with a dead database reports
      # unhealthy instead of green.
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 60s
    logging: *bounded-logs
    restart: unless-stopped

  backup:
    build: .
    # Same image, different job: a pg_dump shipped to storage once a day.
    # One backup shortly after boot (fresh deploys are covered), then a loop
    # anchored to 02:00 UTC — anchored to the clock, not to container start,
    # so a daily redeploy can never starve the schedule.
    entrypoint: ["sh", "-c", "sleep 60; python manage.py backup || echo 'backup FAILED' >&2; while true; do now=$$(date -u +%s); next=$$(date -u -d '02:00' +%s); [ $$next -le $$now ] && next=$$((next + 86400)); sleep $$((next - now)); python manage.py backup || echo 'backup FAILED' >&2; done"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      LSF_DATABASE_URL: postgresql+psycopg://lsf:${POSTGRES_PASSWORD:-lsf}@db:5432/lsf_track
      LSF_UPLOAD_DIR: /srv/lsf/data/uploads
      LSF_S3_BUCKET: ${LSF_S3_BUCKET:-}
      LSF_S3_PREFIX: ${LSF_S3_PREFIX:-}
      LSF_BACKUP_KEEP: ${LSF_BACKUP_KEEP:-30}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
    volumes:
      - uploads:/srv/lsf/data
    logging: *bounded-logs
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    # With a real domain Caddy redirects HTTP->HTTPS and manages certificates
    # itself; ":80" serves plain HTTP.
    command: caddy reverse-proxy --from "${LSF_DOMAIN:-:80}" --to app:8000
    ports:
      - "${LSF_HTTP_PORT:-80}:80"
      - "443:443"
    volumes:
      - caddy_data:/data
    depends_on:
      app:
        condition: service_healthy
    logging: *bounded-logs
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  uploads:
