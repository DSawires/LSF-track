[project]
name = "lsf-track"
version = "0.1.0"
description = "Production tracking for bespoke contract furniture"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "itsdangerous>=2.1",
    "python-multipart>=0.0.9",
    "boto3>=1.34",
    "openpyxl>=3.1",
    # Work order PDFs. Pillow reads the pictures (and the logo) that go on them.
    "reportlab>=4.2",
    # Pillow also re-encodes every uploaded photo as WebP (app/services/images.py).
    "pillow>=10.4",
    # iPhone photos arrive as HEIC, which Pillow cannot decode on its own.
    "pillow-heif>=1.0",
    # Arabic on those PDFs: letter shaping and right-to-left ordering, both
    # pure Python (see app/services/arabic.py).
    "arabic-reshaper>=3.0",
    "python-bidi>=0.6",
    # Drafting a work order's Arabic with Claude (app/services/translate.py).
    "anthropic>=2.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.3", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# The app runs from the source tree (uvicorn app.main:app); installing this
# project just installs its dependencies. Without this, setuptools would try to
# auto-discover app/, seeds/, migrations/ as packages and refuse the flat layout.
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]
