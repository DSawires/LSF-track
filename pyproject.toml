[project]
name = "lsf-track"
version = "0.1.0"
description = "Production tracking for bespoke contract furniture"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "itsdangerous>=2.1",
    "python-multipart>=0.0.9",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=7.3", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# The app runs from the source tree (uvicorn app.main:app); installing this
# project just installs its dependencies. Without this, setuptools would try to
# auto-discover app/, seeds/, migrations/ as packages and refuse the flat layout.
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]
